<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tepuk Nyamuk Vokal</title>
    <!-- Tailwind CSS untuk UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- MediaPipe Libraries untuk Deteksi Tangan -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #1a202c;
            font-family: 'Inter', sans-serif;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
        }
        /* UI Layer harus berada di atas canvas */
        #ui-layer {
            position: absolute;
            z-index: 20;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Agar tidak menghalangi kanvas jika diperlukan */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pointer-events-auto {
            pointer-events: auto;
        }
        video {
            display: none; /* Disembunyikan karena dirender di dalam canvas */
        }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Video Feed untuk MediaPipe (Hidden) -->
    <video id="video-feed" autoplay playsinline></video>
    
    <!-- Kanvas Utama Game -->
    <canvas id="game-canvas"></canvas>

    <!-- UI Overlay (Menu Awal, Loading, Game Over) -->
    <div id="ui-layer">
        <!-- Main Menu -->
        <div id="main-menu" class="pointer-events-auto bg-white/90 p-8 rounded-2xl shadow-2xl text-center max-w-xl mx-4">
            <h1 class="text-4xl font-bold text-blue-600 mb-4">🦟 Tepuk Nyamuk Vokal</h1>
            <p class="text-lg text-gray-700 mb-2">Materi Teknik Vokal - Kelas 7</p>
            <p class="text-sm text-gray-600 mb-6">Gunakan tanganmu melalui webcam untuk menepuk nyamuk dengan jawaban yang benar!</p>
            <button id="start-btn" class="bg-blue-500 hover:bg-blue-600 text-white font-bold py-3 px-8 rounded-full text-xl transition transform hover:scale-105 shadow-lg">
                Mulai Game
            </button>
        </div>

        <!-- Loading State -->
        <div id="loading-screen" class="hidden pointer-events-auto bg-white/90 p-8 rounded-2xl shadow-xl text-center">
            <div class="animate-spin inline-block w-10 h-10 border-[4px] border-current border-t-transparent text-blue-600 rounded-full mb-4" role="status" aria-label="loading"></div>
            <h2 class="text-2xl font-bold text-gray-800">Menyiapkan Kamera...</h2>
            <p class="text-gray-600 mt-2">Pastikan untuk memberikan izin akses kamera (webcam).</p>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="hidden pointer-events-auto bg-white/95 p-10 rounded-3xl shadow-2xl text-center max-w-lg mx-4 border-4 border-blue-400">
            <h1 class="text-5xl font-bold text-blue-600 mb-4">Selesai!</h1>
            <p class="text-xl text-gray-700 mb-2">Skor Akhir Kamu:</p>
            <p id="final-score" class="text-6xl font-black text-green-500 mb-6">0</p>
            <button id="restart-btn" class="bg-green-500 hover:bg-green-600 text-white font-bold py-3 px-8 rounded-full text-xl transition transform hover:scale-105 shadow-lg">
                Main Lagi
            </button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. DATA SOAL & MATERI TEKNIK VOKAL
    // ==========================================
    const questionsData = [
        {
            question: "Cara pengucapan kata demi kata yang baik dan jelas disebut...",
            correct: "Artikulasi",
            wrong: ["Intonasi", "Phrasering", "Resonansi"]
        },
        {
            question: "Tinggi rendahnya suatu nada yang harus dijangkau dengan tepat disebut...",
            correct: "Intonasi",
            wrong: ["Artikulasi", "Phrasering", "Timbre"]
        },
        {
            question: "Aturan pemenggalan kalimat yang baik dan benar sehingga mudah dimengerti disebut...",
            correct: "Phrasering",
            wrong: ["Artikulasi", "Pernapasan", "Vibrato"]
        },
        {
            question: "Pernapasan yang paling baik digunakan untuk bernyanyi adalah pernapasan...",
            correct: "Diafragma",
            wrong: ["Dada", "Perut", "Hidung"]
        },
        {
            question: "Usaha untuk memperindah suara dengan memfungsikan rongga-rongga udara disebut...",
            correct: "Resonansi",
            wrong: ["Intonasi", "Artikulasi", "Phrasering"]
        }
    ];

    // ==========================================
    // 2. VARIABEL GLOBAL & STATE GAME
    // ==========================================
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    const videoElement = document.getElementById('video-feed');
    
    // UI Elements
    const mainMenu = document.getElementById('main-menu');
    const loadingScreen = document.getElementById('loading-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const finalScoreEl = document.getElementById('final-score');

    let isPlaying = false;
    let cameraActive = false;
    let handsActive = false;
    
    // Game State
    let currentQuestionIndex = 0;
    let score = 0;
    let mosquitos = [];
    let pointerX = -100; // Posisi telunjuk (awalnya disembunyikan)
    let pointerY = -100;
    let feedbackText = ""; // Untuk pesan "Benar!" / "Coba Lagi!"
    let feedbackTimer = 0;
    let isPausedForFeedback = false;

    // --- FALLBACK MOUSE & TOUCH ---
    // Jika kamera diblokir di mode preview, pemain tetap bisa main pakai mouse/sentuhan
    canvas.addEventListener('mousemove', (e) => {
        const rect = canvas.getBoundingClientRect();
        pointerX = e.clientX - rect.left;
        pointerY = e.clientY - rect.top;
    });

    canvas.addEventListener('touchmove', (e) => {
        e.preventDefault(); // Mencegah scrolling layar saat disentuh
        const rect = canvas.getBoundingClientRect();
        pointerX = e.touches[0].clientX - rect.left;
        pointerY = e.touches[0].clientY - rect.top;
    }, { passive: false });

    // Resize Canvas untuk memenuhi layar
    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    // ==========================================
    // 3. LOGIKA MEDIAPIPE (HAND TRACKING)
    // ==========================================
    const hands = new Hands({
        locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }
    });

    hands.setOptions({
        maxNumHands: 1, // Kita hanya perlu deteksi 1 tangan agar tidak berat
        modelComplexity: 1,
        minDetectionConfidence: 0.7,
        minTrackingConfidence: 0.7
    });

    // Callback saat MediaPipe berhasil mendeteksi sesuatu dari frame kamera
    hands.onResults((results) => {
        if (!handsActive) handsActive = true;
        
        if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
            const landmarks = results.multiHandLandmarks[0];
            
            // Landmark 8 adalah Ujung Jari Telunjuk (Index Finger Tip)
            const indexFingerTip = landmarks[8];
            
            // Konversi koordinat normalisasi (0-1) ke pixel canvas.
            // PENTING: Karena webcam itu efek cermin (mirrored), kita membalik kordinat X.
            pointerX = (1 - indexFingerTip.x) * canvas.width;
            pointerY = indexFingerTip.y * canvas.height;
        } else {
            // Jika tangan tidak terdeteksi
            pointerX = -100;
            pointerY = -100;
        }
    });

    let camera;
    async function startCamera() {
        if (!camera) {
            try {
                // Meminta izin kamera secara eksplisit untuk menangkap error jika diblokir (misal di mode Preview)
                await navigator.mediaDevices.getUserMedia({ video: true });
                
                camera = new Camera(videoElement, {
                    onFrame: async () => {
                        if(isPlaying) {
                            await hands.send({image: videoElement});
                        }
                    },
                    width: 640,
                    height: 480
                });
                await camera.start();
                cameraActive = true;
                return true;
            } catch (error) {
                console.warn("Kamera diblokir atau tidak tersedia:", error);
                cameraActive = false;
                
                // Ubah teks UI untuk memberitahu pemain
                const loadingTitle = loadingScreen.querySelector('h2');
                const loadingDesc = loadingScreen.querySelector('p');
                if(loadingTitle) loadingTitle.innerText = "Kamera Tidak Terdeteksi/Diblokir";
                if(loadingDesc) loadingDesc.innerText = "Game dialihkan ke mode Mouse / Sentuh Layar...";
                
                return false;
            }
        }
        return true;
    }

    // ==========================================
    // 4. SISTEM ENTITAS (NYAMUK)
    // ==========================================
    class Mosquito {
        constructor(text, isCorrect) {
            this.radius = 50;
            // Spawn acak di area yang aman (tidak terlalu pinggir)
            this.x = Math.random() * (canvas.width - this.radius * 4) + this.radius * 2;
            this.y = Math.random() * (canvas.height - 200) + 150; // Hindari teks pertanyaan di atas
            
            // Kecepatan gerak
            this.dx = (Math.random() - 0.5) * 6;
            this.dy = (Math.random() - 0.5) * 6;
            
            this.text = text;
            this.isCorrect = isCorrect;
        }

        update() {
            this.x += this.dx;
            this.y += this.dy;

            // Pantulan tembok (Bouncing)
            if (this.x - this.radius < 0 || this.x + this.radius > canvas.width) this.dx *= -1;
            // Batas atas disisakan untuk area pertanyaan
            if (this.y - this.radius < 100 || this.y + this.radius > canvas.height) this.dy *= -1;
        }

        draw(ctx) {
            // Gambar Emoji Nyamuk/Lingkaran
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)"; // Bubble background
            ctx.fill();
            ctx.strokeStyle = this.isCorrect ? "#3b82f6" : "#64748b"; // Hint warna tipis jika ingin (bisa disamakan agar lebih sulit)
            ctx.lineWidth = 3;
            ctx.stroke();
            ctx.closePath();

            ctx.font = '40px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('🦟', this.x, this.y - 15);

            // Gambar Teks Pilihan Jawaban
            ctx.font = 'bold 18px Inter';
            ctx.fillStyle = '#1e293b';
            
            // Word wrap sederhana (asumsi teks tidak terlalu panjang)
            ctx.fillText(this.text, this.x, this.y + 15);
        }
    }

    function loadQuestion() {
        if (currentQuestionIndex >= questionsData.length) {
            endGame();
            return;
        }

        const qData = questionsData[currentQuestionIndex];
        mosquitos = [];
        
        // Kumpulkan semua opsi dan acak
        let options = [
            { text: qData.correct, isCorrect: true },
            { text: qData.wrong[0], isCorrect: false },
            { text: qData.wrong[1], isCorrect: false },
            { text: qData.wrong[2], isCorrect: false }
        ];

        // Pengacakan array (Fisher-Yates shuffle)
        for (let i = options.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [options[i], options[j]] = [options[j], options[i]];
        }

        // Buat objek nyamuk
        options.forEach(opt => {
            mosquitos.push(new Mosquito(opt.text, opt.isCorrect));
        });
    }

    // ==========================================
    // 5. GAME LOOP & RENDERER
    // ==========================================
    function checkCollisions() {
        if (isPausedForFeedback) return;

        // Area hitbox (jari)
        const hitRadius = 20;

        for (let i = 0; i < mosquitos.length; i++) {
            const m = mosquitos[i];
            const dist = Math.hypot(pointerX - m.x, pointerY - m.y);
            
            if (dist < m.radius + hitRadius) {
                // Terjadi Tabrakan / Tepukan!
                handleHit(m.isCorrect);
                break; // Mencegah double hit
            }
        }
    }

    function handleHit(isCorrect) {
        isPausedForFeedback = true;
        
        if (isCorrect) {
            score += 10;
            feedbackText = "BENAR! (+10)";
        } else {
            score -= 5;
            feedbackText = "SALAH! (-5) Coba Lagi!";
        }

        // Tahan layar selama 1.5 detik
        feedbackTimer = 90; // Asumsi 60 FPS (1.5 detik)

        if (isCorrect) {
            // Lanjut soal berikutnya
            setTimeout(() => {
                currentQuestionIndex++;
                loadQuestion();
            }, 1500);
        }
    }

    function gameLoop() {
        if (!isPlaying) return;
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Render Video Webcam sebagai Background
        if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
            ctx.save();
            ctx.globalAlpha = 0.3; // Samar
            // Flip video horizontal
            ctx.translate(canvas.width, 0);
            ctx.scale(-1, 1);
            // Render mengisi layar
            ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);
            ctx.restore();
        }

        // 2. Render UI Game (Pertanyaan & Skor)
        ctx.fillStyle = 'white';
        ctx.font = 'bold 24px Inter';
        ctx.textAlign = 'left';
        ctx.fillText(`Skor: ${score}`, 30, 40);
        ctx.fillText(`Soal: ${currentQuestionIndex + 1} / ${questionsData.length}`, 30, 70);

        if (currentQuestionIndex < questionsData.length) {
            // Kotak pertanyaan
            const questionText = questionsData[currentQuestionIndex].question;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.roundRect(canvas.width/2 - 400, 20, 800, 80, 20);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.font = 'bold 22px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(questionText, canvas.width/2, 60);
        }

        // 3. Render Feedback jika baru menjawab
        if (isPausedForFeedback) {
            feedbackTimer--;
            
            ctx.fillStyle = feedbackText.includes("BENAR") ? 'rgba(34, 197, 94, 0.8)' : 'rgba(239, 68, 68, 0.8)';
            ctx.font = 'bold 60px Inter';
            ctx.textAlign = 'center';
            ctx.fillText(feedbackText, canvas.width/2, canvas.height/2);

            if (feedbackTimer <= 0) {
                isPausedForFeedback = false;
            }
        } else {
            // 4. Update dan Render Nyamuk
            mosquitos.forEach(m => {
                m.update();
                m.draw(ctx);
            });
            
            // 5. Cek Tabrakan (Deteksi Gestur)
            checkCollisions();
        }

        // 6. Render Pointer (Titik merah pelacak jari)
        if (pointerX > 0 && pointerY > 0) {
            ctx.beginPath();
            ctx.arc(pointerX, pointerY, 15, 0, Math.PI * 2);
            ctx.fillStyle = 'red';
            ctx.fill();
            ctx.lineWidth = 3;
            ctx.strokeStyle = 'white';
            ctx.stroke();
            ctx.closePath();

            // Efek glow pointer
            ctx.beginPath();
            ctx.arc(pointerX, pointerY, 30, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(255, 0, 0, 0.3)';
            ctx.fill();
            ctx.closePath();
        }

        // Looping
        requestAnimationFrame(gameLoop);
    }

    // ==========================================
    // 6. FLOW KONTROL (START, END, RESTART)
    // ==========================================
    startBtn.addEventListener('click', async () => {
        mainMenu.classList.add('hidden');
        loadingScreen.classList.remove('hidden');

        // Reset teks loading (jika main ulang setelah error kamera)
        loadingScreen.querySelector('h2').innerText = "Menyiapkan Kamera...";
        loadingScreen.querySelector('p').innerText = "Pastikan untuk memberikan izin akses kamera (webcam).";

        // Tunggu kamera menyala (atau gagal jika diblokir preview)
        const cameraSuccess = await startCamera();
        
        // Delay agar model MediaPipe siap atau memberi waktu user membaca pesan error
        setTimeout(() => {
            loadingScreen.classList.add('hidden');
            isPlaying = true;
            score = 0;
            currentQuestionIndex = 0;
            loadQuestion();
            gameLoop(); // Mulai loop permainan
        }, cameraSuccess ? 2000 : 3500); // Delay lebih lama jika beralih ke mode mouse/touch
    });

    function endGame() {
        isPlaying = false;
        gameOverScreen.classList.remove('hidden');
        finalScoreEl.innerText = score;
    }

    restartBtn.addEventListener('click', () => {
        gameOverScreen.classList.add('hidden');
        isPlaying = true;
        score = 0;
        currentQuestionIndex = 0;
        loadQuestion();
        gameLoop();
    });

    // Helper untuk membuat rounded rectangle di Canvas API (polyfill)
    CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
        if (w < 2 * r) r = w / 2;
        if (h < 2 * r) r = h / 2;
        this.beginPath();
        this.moveTo(x + r, y);
        this.arcTo(x + w, y, x + w, y + h, r);
        this.arcTo(x + w, y + h, x, y + h, r);
        this.arcTo(x, y + h, x, y, r);
        this.arcTo(x, y, x + w, y, r);
        this.closePath();
        return this;
    }
</script>
</body>
</html>
